function filter(cat, el) {
  document.querySelectorAll('.u2-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderCards(cat === 'all' ? apps : apps.filter(a=>a.cat===cat));
}

function renderCards(list) {
  const g = document.getElementById('grid');
  g.innerHTML = '';
  list.forEach((app, i) => {
    const badgeClass = app.badge === 'ui' ? 'badge-ui' : app.badge === 'prog' ? 'badge-prog' : 'badge-vinc';
    const div = document.createElement('div');
    div.className = 'u2-card';
    div.innerHTML = `
      <div class="u2-card-top">
        <div class="u2-icon">${app.icon}</div>
        <div>
          <div class="u2-title">${app.title}</div>
          <span class="u2-badge ${badgeClass}">${app.badgeLabel}</span>
        </div>
      </div>
      <div class="u2-desc">${app.desc}</div>
      <div class="u2-tags">${app.temas.map(t=>`<span class="u2-tag">${t}</span>`).join('')}</div>
      <div class="u2-detail" id="det-${i}">
        <h4>${app.detalle.title}</h4>
        <ul>${app.detalle.items.map(it=>`<li>${it}</li>`).join('')}</ul>
      </div>`;
    div.onclick = () => {
      const det = document.getElementById('det-'+i);
      det.classList.toggle('open');
    };
    g.appendChild(div);
  });
}
